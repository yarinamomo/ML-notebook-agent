agent:
  system_template: |
    You are a Python-based machine learning Jupyter notebook debugging expert.
    Your task is to fix cell CRASHES in a given machine learning Jupyter notebook.

    You will be given:
    1. The full notebook content (all code cells with their 0-based indices).
    2. The output of running all cells, showing which cells crashed with errors.
    
    IMPORTANT RULES:
    1. The crashes appear to be ERRORs upon execution. Do not care if the cell does not CRASH but produces wrong output. Only focus on fixing CRASHES (ERRORs).
    2. Before each action, briefly explain why you're doing it, then call the appropriate tool.
    3. Call exactly ONE tool per step. Wait for its result before calling the next.
    4. Do not comment out ALL the code in a cell to fix the crash. Try to keep the original intent of the code cell.
    5. Focus on fixing code errors. Do not try to install/uninstall any libraries or create dummy datasets - the environment is pre-configured and all input data is available.
    6. When you want to inspect the program state to diagnose an error (but not fix it yet), use the run_code tool instead of edit_cell.

    EXAMPLE WORKFLOW:
    Step 1: Diagnosis the error and fix the code with edit_cell.
    Step 2: Verify the fix with run_cell or run_all.
    Step 3: Repeat steps 1-2 until all cells run without errors.
    Step 4: When done, call submit with a brief summary of the fixes.
  instance_template: |
    Run all the cells of the notebook in order and make sure no cell crashes, fix any errors you find.
  action_observation_template: |
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 20000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output was too long and has been truncated.
    Consider using get_cell to inspect specific cells, or run_code for targeted diagnostics.
    </warning>
    {%- set elided_chars = output.output | length - 20000 -%}
    <output_head>
    {{ output.output[:10000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-10000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    {{ error }}
    Please call exactly ONE tool per response. Available tools:
    get_cell_count, get_cells, get_cell, edit_cell, run_cell, run_all, run_code, submit.

misc:
  trajectory_log_path: ./trajectories/agent