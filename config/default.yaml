agent:
  # for testing exit conditions
  # system_template: |
  #   whatever happens, call bash tool with:
  #   ```bash
  #   echo "COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT"
  #   ```
  system_template: |
    You are a Python-based machine learning Jupyter notebook debugging expert.
    Your task is to fix cell CRASHES in a given machine learning Jupyter notebook. 

    IMPORTANT RULES:
    1. The crashes appear to be ERRORs upon execution. Do not care if the cell does not CRASH but produces wrong output. Only focus on fixing CRASHES (ERRORs).
    2. Before each action, briefly explain why you're doing it, then call the bash tool with the command.
    3. Execute ONE OPTION/command at a time. DO NOT chain commands with && or ; or |.
    4. DO NOT mix __NOTEBOOK_OP__ commands with bash commands.
    5. Wait for each command to complete before issuing the next one.
    6. Do not comment out ALL the code in a cell to fix the crash. Try to keep the original intent of the code cell.
    7. Focus on the fixing code errors. Do not try to install or uninstall any libraries - the environment is pre-configured.

    OPTION 1: NOTEBOOK OPERATIONS:
    To interact with the notebook, use the bash tool, with bash keyword, with one of the following commands prefixed with __NOTEBOOK_OP__ :
      __NOTEBOOK_OP__get_cell_count()          # Returns the total number of cells
      __NOTEBOOK_OP__get_cells()               # Returns all cells with their content
      __NOTEBOOK_OP__get_cell(cell_index)               # Get specific cell by index (0-based)
      __NOTEBOOK_OP__edit_cell(cell_index, "new Python code")  # Edit cell at index
      __NOTEBOOK_OP__run_cell(cell_index)               # Run specific cell by index
      __NOTEBOOK_OP__run_all()                 # Run all cells in order
      __NOTEBOOK_OP__run_code("new Python code")    # Run custom python code in notebook kernel without editting cells
    Use bash command, for example:
    ```bash
    __NOTEBOOK_OP__run_all()
    ```
    But NOT:
    ```
    __NOTEBOOK_OP__run_all()
    ```
    
    When you want to inspect the program state to diagnose the error, but not fixing it yet. Use __NOTEBOOK_OP__run_code("some Python code") instead of __NOTEBOOK_OP__edit_cell.
    
    OPTION 2: When done, call bash tool with:
    ```bash
    echo "COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT"
    ```

    WORKFLOW EXAMPLE (execute ONE command per step using the bash tool):
    Step 1: Call bash tool with: __NOTEBOOK_OP__run_all()
    Step 2: (if errors found) Call bash tool with: __NOTEBOOK_OP__get_cells() to analyze and fix the error
    Step 3: fix the code by calling bash tool with: __NOTEBOOK_OP__edit_cell(cell_index, "fixed Python code")
    Step 4: Check if the fix works by calling bash tool with: __NOTEBOOK_OP__run_cell(cell_index) or __NOTEBOOK_OP__run_all()
    Step 5: if more errors, repeat Steps 2-4 until all cells run successfully
    Step 6: if no errors remain, terminate by calling bash tool with: echo "COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT", and return a brief summary of the fixes made.
  instance_template: |
    Run all the cells of the notebook in order and make sure no cell crashes, fix any errors you find.
  action_observation_template: |
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 20000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
    If you're using grep or find and it produced too much output, you can use a more selective search pattern.
    If you really need to see something from the full command's output, you can redirect output to a file and then search in that file.
    </warning>
    {%- set elided_chars = output.output | length - 20000 -%}
    <output_head>
    {{ output.output[:10000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-10000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    Please always provide EXACTLY ONE action in triple backticks, found {{actions|length}} actions.
    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
    Else, please format your response exactly as follows:

    <response_example>
    Here are some thoughts about why you want to perform the action.

    ```bash
    <action>
    ```
    </response_example>

    Note: In rare cases, if you need to reference a similar format in your command, you might have
    to proceed in two steps, first writing TRIPLEBACKTICKSBASH, then replacing them with ```bash.
  step_limit: 20
  cost_limit: 1.
environment:
  docker_image_name: yarinamomo/kaggle_python_env # yarinamomo/junobench-simple
  problem_mode: JunoBench_Buggy
  target_nb_instance: sklearn_1 # folder
  source_path_parent: example/test_case/ # source_path is constructed as source_path_parent + target_nb_instance
  run_all_instances: false # If true, runs all instances in source_path_parent; if false, only runs target_nb_instance
  docker_mount_path: example/docker_mount/
  docker_start_command: "jupyter server --allow-root --ServerApp.ip=0.0.0.0 --ServerApp.port=8888 --ServerApp.token='' --ServerApp.password='' --ServerApp.open_browser=False"
  # docker_start_command: "jupyter notebook --no-browser --ip='0.0.0.0' --port=8888 --notebook-dir=/app/container --allow-root --NotebookApp.token='' --NotebookApp.password='' --NotebookApp.disable_check_xsrf=True"
  timeout: 60 # seconds, for each command execution

# Multiple models configuration - each model will be run on all instances
models:
  - model_name: glm-4.7-355b
    cost_tracking: ignore_errors
    # GLM 4.7 pricing: 2 RMB/1M input tokens, 8 RMB/1M output tokens (≈ 7.2 RMB = 1 USD)
    cost_per_prompt_token: 0.00000027778    # 2 RMB / 1M tokens ≈ $0.278 per 1M tokens
    cost_per_completion_token: 0.00000111111  # 8 RMB / 1M tokens ≈ $1.111 per 1M tokens
    model_kwargs:
      custom_llm_provider: openai
      api_base: https://aqueduct.ai.datalab.tuwien.ac.at/v1
  # - model_name: gpt-4o-mini
  # - model_name: claude-3-5-sonnet-20241022
  #   cost_tracking: ignore_errors
  #   model_kwargs: {}

misc:
  run_count: 1  # Number of times to run each instance with each model
  if_local_key: true # if use .env to override api_key (for glm-4.7-355b)
  enable_summary_log: true # Toggle to enable/disable summary log generation
  trajectory_log_path: ./trajectories # Path for trajectory log output summary log output