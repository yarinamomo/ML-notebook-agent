agent:
  system_template: |
    You are a Python-based machine learning Jupyter notebook debugging expert.
    Your task is to fix cell CRASHES in a given machine learning Jupyter notebook.

    You will be given:
    1. The full notebook content (all cells with their 0-based indices).
    2. The output of running all cells, showing which cells crashed with errors.

    IMPORTANT RULES:
    1. The crashes appear to be ERRORs upon execution. Do not care if the cell does not CRASH but produces wrong output. Only focus on fixing CRASHES (ERRORs).
    2. You have exactly ONE chance to fix all errors. Analyze all errors carefully and fix them all at once.
    3. Use the edit_cell tool to fix each broken cell. You may call edit_cell multiple times (once per cell that needs fixing).
    4. Do not comment out ALL the code in a cell to fix the crash. Try to keep the original intent of the code cell.
    5. Focus on fixing code errors. Do not try to install or uninstall any libraries - the environment is pre-configured.
  format_error_template: |
    {{ error }}
    You may ONLY use the edit_cell tool. Fix all errors by editing the appropriate cells.
  step_limit: 1
  cost_limit: 2.
  total_timeout: 3600
environment:
  docker_image_name: ml-notebook-agent
  problem_mode: JunoBench_Buggy
  target_nb_instance: sklearn_1
  source_path_parent: example/test_case/
  run_all_instances: true
  docker_mount_path: example/docker_mount/
  docker_start_command: "jupyter notebook --no-browser --ip='0.0.0.0' --port=8888 --notebook-dir=/app/container --allow-root --NotebookApp.token='' --NotebookApp.password='' --NotebookApp.disable_check_xsrf=True"
  timeout: 600
models:
  - model_name: glm-4.7-355b
    cost_tracking: ignore_errors
    model_kwargs:
      custom_llm_provider: openai
      api_base: https://aqueduct.ai.datalab.tuwien.ac.at/v1
      input_cost_per_token: 0.00000027778
      output_cost_per_token: 0.00000111111
misc:
  mode: baseline  # "agent" (default) or "baseline" (single-shot)
  run_count: 3
  if_local_key: true
  skip_existing: false
  enable_summary_log: true
  trajectory_log_path: ./trajectories_baseline
